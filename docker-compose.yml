services:
  nas-toolbox:
    image: ${DOCKERHUB_USERNAME:-YOUR_DOCKERHUB_USERNAME}/nas-toolbox:latest
    container_name: nas-toolbox
    restart: unless-stopped
    ports:
      - "17701:17701"
    volumes:
      - /mnt:/mnt
      - /vol2:/vol2
    environment:
      - ALLOWED_ROOTS=/mnt,/vol2
      - TZ=Asia/Shanghai
