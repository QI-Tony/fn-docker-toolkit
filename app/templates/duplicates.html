{% extends "base.html" %}
{% block title %}重复文件检测 · NAS Toolbox{% endblock %}
{% block content %}
<a class="back-link" href="/">← 返回工具箱</a>
<section class="page-heading">
  <span class="tool-icon large">≡</span>
  <div>
    <h1>重复文件检测</h1>
    <p>先按大小筛选候选，再以流式 MD5 验证内容。</p>
  </div>
</section>

<section class="panel">
  <form id="scan-form">
    <label for="path">扫描目录</label>
    <div class="input-row">
      <input id="path" name="path" type="text" placeholder="/mnt/photos" required autocomplete="off">
      <button class="button primary" type="submit">开始扫描</button>
    </div>
    <p class="hint">大目录扫描可能需要一些时间。扫描不会自动删除任何文件。</p>
  </form>
</section>

<div id="status" class="status hidden" role="status"></div>
<section id="results" class="hidden">
  <div id="summary" class="stats"></div>
  <div id="error-list"></div>
  <div class="result-title results-toolbar">
    <div><h2>重复文件组</h2><p>每组请选择一个要保留的文件。</p></div>
    <button id="delete-button" class="button danger hidden" type="button">确认删除其余文件</button>
  </div>
  <div id="group-list"></div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', path='/duplicates.js') }}"></script>{% endblock %}
