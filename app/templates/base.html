<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NAS Toolbox{% endblock %}</title>
  <style>{{ app_css | safe }}</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" data-app-path="">
      <span class="brand-mark">N</span>
      <span>NAS Toolbox</span>
    </a>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer>NAS Toolbox · 轻量、可控的 NAS 文件工具</footer>
  <script>{{ common_js | safe }}</script>
  {% block scripts %}{% endblock %}
</body>
</html>
