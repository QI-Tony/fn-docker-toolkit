{% extends "base.html" %}
{% block title %}删除空文件夹 · NAS Toolbox{% endblock %}
{% block content %}
<a class="back-link" href="../../" data-app-path="">← 返回工具箱</a>
<section class="page-heading">
  <span class="tool-icon large">⌫</span>
  <div>
    <h1>删除空文件夹</h1>
    <p>递归查找空目录，包括删除子目录后也会变空的父目录。</p>
  </div>
</section>

<section class="panel">
  <form id="scan-form">
    <label for="path">扫描目录</label>
    <div class="input-row">
      <input id="path" name="path" type="text" placeholder="/mnt/storage/photos" required autocomplete="off">
      <button class="button primary" type="submit">开始扫描</button>
    </div>
    <p class="hint">只能访问管理员通过 ALLOWED_ROOTS 配置的目录；不会跟随 symbolic link。</p>
  </form>
</section>

<div id="status" class="status hidden" role="status"></div>
<section id="results" class="panel hidden">
  <div class="result-title">
    <div><h2>扫描结果</h2><p id="result-summary"></p></div>
    <button id="delete-button" class="button danger hidden" type="button">确认删除</button>
  </div>
  <div id="error-list"></div>
  <ul id="directory-list" class="path-list"></ul>
</section>
{% endblock %}
{% block scripts %}<script>{{ empty_directories_js | safe }}</script>{% endblock %}
