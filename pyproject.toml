[project]
name = "nas-toolbox"
version = "0.1.0"
description = "A lightweight, Docker-first toolbox for Linux NAS systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0,<1.0",
    "jinja2>=3.1.6,<4.0",
    "uvicorn[standard]>=0.35.0,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0",
    "pytest>=8.4.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
